apiVersion: apps/v1
kind: Deployment

metadata:
  name: techbamboo-app
  namespace: techbamboo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: techbamboo

  template:
    metadata:
      labels:
        app: techbamboo

    spec:
      containers:
        - name: techbamboo-container

          image: bamboo-ecology-site-app:v2

          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

          envFrom:
            - configMapRef:
                name: techbamboo-config
