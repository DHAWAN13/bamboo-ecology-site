<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin — Project Requests</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <!-- ===============================
     NAVBAR
================================ -->
    <nav class="nav">
      <span class="logo">TechBamboo — Admin</span>
      <div>
        <a href="/">Home</a>
      </div>
    </nav>

    <!-- ===============================
     ADMIN SECTION
================================ -->
    <section class="section-light">
      <div class="text-container">
        <h1>Project Requests</h1>

        <!-- IMPORTANT: admin-table class is REQUIRED -->
        <table
          class="admin-table"
          border="1"
          cellpadding="10"
          cellspacing="0"
          width="100%"
        >
          <thead>
            <tr>
              <th>Name</th>
              <th>User Type</th>
              <th>Project Type</th>
              <th>Status</th>
              <th>Submitted On</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="request-table-body"></tbody>
        </table>
      </div>
    </section>

    <!-- ===============================
     FOOTER
================================ -->
    <footer class="site-footer">
      <p>© 2025 • Systems, Structures & Sustainability</p>
    </footer>

    <!-- ===============================
     FETCH & RENDER ADMIN DATA
================================ -->
    <script>
      fetch("/admin/requests")
        .then((res) => res.json())
        .then((data) => {
          const tbody = document.getElementById("request-table-body");
          tbody.innerHTML = "";

          data.forEach((req) => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${req.name}</td>
                <td>${req.userType}</td>
                <td>${req.projectType}</td>

                <td>
                    <select
                        id="status-${req._id}"
                        onchange="applyStatusStyle(this)"
                    >
                        <option value="Pending" ${req.status === "Pending" ? "selected" : ""}>Pending</option>
                        <option value="Reviewed" ${req.status === "Reviewed" ? "selected" : ""}>Reviewed</option>
                        <option value="Approved" ${req.status === "Approved" ? "selected" : ""}>Approved</option>
                    </select>
                </td>

                <td>${new Date(req.createdAt).toLocaleString()}</td>

                <td>
                    <button onclick="saveStatus('${req._id}')">Save</button>
                    <button class="delete-btn" onclick="deleteRequest('${req._id}')">
                        Delete
                    </button>
                </td>
            `;

            tbody.appendChild(row);

            /* Apply status color AFTER element is added */
            const selectEl = row.querySelector("select");
            applyStatusStyle(selectEl);
          });
        })
        .catch((err) => {
          console.error("Fetch error:", err);
          alert("Failed to load admin data");
        });
    </script>

    <!-- ===============================
     UPDATE STATUS
================================ -->
    <script>
      function saveStatus(id) {
        const status = document.getElementById(`status-${id}`).value;

        fetch("/admin/update-status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: id, status }),
        })
          .then((res) => res.text())
          .then((msg) => alert(msg))
          .catch((err) => {
            console.error(err);
            alert("Update failed");
          });
      }
    </script>

    <!-- ===============================
     DELETE REQUEST
================================ -->
    <script>
      function deleteRequest(id) {
        const confirmDelete = confirm(
          "Are you sure you want to delete this request?\nThis action cannot be undone.",
        );

        if (!confirmDelete) return;

        fetch(`/admin/delete/${id}`, { method: "POST" })
          .then((res) => res.text())
          .then((msg) => {
            alert(msg);
            location.reload();
          })
          .catch((err) => {
            console.error(err);
            alert("Delete failed");
          });
      }
    </script>

    <!-- ===============================
     STATUS COLOR HANDLER
================================ -->
    <script>
      function applyStatusStyle(selectEl) {
        if (!selectEl) return;

        selectEl.classList.remove(
          "status-approved",
          "status-pending",
          "status-reviewed",
        );

        if (selectEl.value === "Approved") {
          selectEl.classList.add("status-approved");
        } else if (selectEl.value === "Pending") {
          selectEl.classList.add("status-pending");
        } else {
          selectEl.classList.add("status-reviewed");
        }
      }
    </script>
  </body>
</html>
