<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TechBamboo — Gallery</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <!-- ================================
     NAVIGATION BAR
================================ -->
    <nav class="nav">
      <span class="logo">TechBamboo</span>
      <div>
        <a href="/">Home</a>
        <a href="/cs-ecology">Philosophy</a>
        <a href="/bamboo">Bamboo</a>
        <a href="/architecture">Architecture</a>
        <a href="/gallery" class="active">Projects</a>
        <a href="/request-quote">Request Quote</a>
      </div>
    </nav>

    <!-- ================================
     GALLERY SECTION
================================ -->
    <section class="gallery section-soft reveal">
      <h2>Bamboo Pavilion — Construction Study</h2>

      <p class="gallery-intro">
        A hands-on exploration of bamboo as a structural and ecological system.
      </p>

      <!-- 3 Rows × 2 Columns Grid -->
      <div class="gallery-grid-2x3">
        <figure>
          <img
            src="/images/gallery/1.jpg"
            alt="Ground preparation and initial layout"
          />
          <figcaption>Ground preparation and initial layout</figcaption>
        </figure>

        <figure>
          <img src="/images/gallery/2.jpg" alt="Structural staking" />
          <figcaption>Structural staking</figcaption>
        </figure>

        <figure>
          <img
            src="/images/gallery/3.jpg"
            alt="Weaving technique development"
          />
          <figcaption>Weaving technique development</figcaption>
        </figure>

        <figure>
          <img
            src="/images/gallery/4.jpg"
            alt="Wall enclosure forming spatial boundaries"
          />
          <figcaption>Wall enclosure forming spatial boundaries</figcaption>
        </figure>

        <figure>
          <img src="/images/gallery/5.jpg" alt="Interior spatial definition" />
          <figcaption>Interior spatial definition</figcaption>
        </figure>

        <figure>
          <img src="/images/gallery/6.jpg" alt="Completed bamboo shelter" />
          <figcaption>Completed bamboo shelter</figcaption>
        </figure>
      </div>
    </section>

    <!-- ================================
     FOOTER
================================ -->
    <footer class="site-footer">
      <p>© 2025 • Systems, Structures & Sustainability</p>
    </footer>
